[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raef"
version = "0.1.0"
description = "Retrieval-Augmented Extended Forecasting"
readme = "README.md"
requires-python = ">=3.12,<3.13.0"
license = { text = "Apache-2.0" }
authors = [
  { name="Juan Pablo Villa Serna", email="juan.pablo.villa@fau.de" }
]

# required dependencies
dependencies = [
  "torch>=2.7.0,<2.8.0",
  "torchvision>=0.22.0,<0.23.0",
  "torchaudio>=2.7.0,<2.8.0",
  "chromadb>=0.6.3,<0.7.0",
  "chronos-forecasting>=1.5.2,<1.6.0",
  "datasets>=2.17.1,<2.18.0",
  "GitPython>=3.1.44,<3.2.0",
  "gluonts>=0.14.4,<0.15.0",
  "hydra-core>=1.3.0,<1.4.0",
  "jax>=0.6.1,<0.7.0",
  "jaxtyping>=0.2.38,<0.3.0",
  "kagglehub>=0.3.6,<0.4.0",
  "lightning>=2.5.0.post0,<2.6.0.post0",
  "matplotlib>=3.10.0,<3.11.0",
  "numpy>=1.26.4,<1.27.0",
  "pandas>=2.1.4,<2.2.0",
  "pip>=24.0,<25.0",
  "pyarrow>=18.1.0,<19.0.0",
  "PyYAML>=6.0.2,<6.1.0",
  "requests>=2.32.3,<2.33.0",
  "torchmetrics>=1.6.1,<1.7.0",
  "tabulate>=0.9.0,<0.10.0",
  "transformers>=4.48.3,<4.49.0",
  "pydantic>=2.12.4,<2.13.0",
  "pydantic-settings>=2.15.0,<2.16.0",
]

# optional dependencies
[project.optional-dependencies]
cpu = [
  "torch",
  "torchvision",
  "torchaudio",
]

cuda128 = [
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.7.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl",
    "torchvision @ https://download.pytorch.org/whl/cu128/torchvision-0.22.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl",
    "torchaudio @ https://download.pytorch.org/whl/cu128/torchaudio-2.7.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl"
]

dev = [
  "pytest",
  "black",
]

[tool.setuptools]
license-files = ["LICENSE"]

# Ensure setuptools finds your package inside src/
[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/jpvilla1990/raef"
Repository = "https://github.com/jpvilla1990/raef"
PyPI = "https://pypi.org/project/raef/"
Issues = "https://github.com/jpvilla1990/raef/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
