[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raef"
version = "0.1.0"
description = "Retrieval-Augmented Extended Forecasting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name="Juan Pablo Villa Serna", email="juan.pablo.villa@fau.de" }
]

# required dependencies
dependencies = [
  "numpy>=1.26.4",
  "pandas>=2.1.4",
  "requests>=2.32.3",
  "torchmetrics>=1.6.1",
]

# optional dependencies
[project.optional-dependencies]
cpu = [
  "torch>=2.4.1",
  "torchvision",
  "torchaudio",
]

cuda = [
    "torch @ https://download.pytorch.org/whl/cu121/torch-2.2.0%2Bcu121-cp310-cp310-linux_x86_64.whl",
    "torchvision @ https://download.pytorch.org/whl/cu121/torchvision-0.17.1%2Bcu121-cp310-cp310-linux_x86_64.whl",
    "torchaudio @ https://download.pytorch.org/whl/cu121/torchaudio-2.2.1%2Bcu121-cp310-cp310-linux_x86_64.whl"
]

dev = [
  "pytest",
  "black",
  "mypy",
]
gpu = [
  "torch",
  "faiss-gpu"
]

[tool.setuptools]
license-files = ["LICENSE"]

# Ensure setuptools finds your package inside src/
[tool.setuptools.packages.find]
where = ["src"]
